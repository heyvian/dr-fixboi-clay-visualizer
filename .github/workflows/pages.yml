name: Verify GitHub Pages build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - name: Check tracked Pages files
        run: |
          if [ -n "$(git status --short -- .nojekyll index.html pages-assets)" ]; then
            git status --short -- .nojekyll index.html pages-assets
            exit 1
          fi
